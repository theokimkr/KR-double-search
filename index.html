<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Google, Naver & YouTube Quick Search Widget</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    // Tailwind 다크모드 클래스 기반 설정
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
          },
          colors: {
            notion: {
              light: '#FFFFFF',
              lightHover: '#F7F7F5',
              lightBorder: '#E5E5E3',
              dark: '#191919',
              darkSurface: '#202020',
              darkBorder: '#2F2F2F',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* 빈 입력창 제출 시 가벼운 좌우 흔들림 애니메이션 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 기본 브라우저 검색창 클리어 버튼 제거 */
    input[type="search"]::-webkit-search-decoration,
    input[type="search"]::-webkit-search-cancel-button,
    input[type="search"]::-webkit-search-results-button,
    input[type="search"]::-webkit-search-results-decoration {
      -webkit-appearance: none;
    }
  </style>
</head>
<body class="bg-notion-light dark:bg-notion-dark text-neutral-800 dark:text-neutral-100 transition-colors duration-200 min-h-screen flex items-center justify-center p-2 sm:p-4 select-none overflow-hidden">

  <!-- 우측 상단 미니멀 테마 전환 토글 버튼 (노션 라이트/다크 맞춤) -->
  <button
    id="themeToggleBtn"
    type="button"
    aria-label="테마 전환 (라이트/다크 모드)"
    title="노션 라이트/다크 배경 전환"
    class="fixed top-2 right-2 z-10 p-1.5 rounded-lg text-neutral-400 hover:text-neutral-700 dark:text-neutral-500 dark:hover:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500/40"
  >
    <!-- 해 아이콘 (다크모드일 때 표시 -> 클릭 시 라이트모드) -->
    <svg id="sunIcon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"></circle>
      <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
    <!-- 달 아이콘 (라이트모드일 때 표시 -> 클릭 시 다크모드) -->
    <svg id="moonIcon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <!-- 메인 위젯 컨테이너 -->
  <main class="w-full max-w-xl mx-auto flex flex-col gap-3">
    <!-- 1. 구글(Google) 빠른 검색창 -->
    <form
      id="googleSearchForm"
      action="https://www.google.com/search"
      method="get"
      target="_blank"
      rel="noopener noreferrer"
      novalidate
      class="relative group"
    >
      <div
        id="googleSearchBarWrapper"
        class="flex items-center w-full h-11 sm:h-12 px-3.5 sm:px-4 rounded-full bg-white dark:bg-notion-darkSurface border border-notion-lightBorder dark:border-notion-darkBorder shadow-[0_1px_4px_rgba(0,0,0,0.04)] dark:shadow-[0_1px_6px_rgba(0,0,0,0.25)] hover:shadow-[0_2px_8px_rgba(0,0,0,0.08)] dark:hover:border-neutral-600 focus-within:border-blue-500/60 dark:focus-within:border-blue-400/60 focus-within:shadow-[0_2px_10px_rgba(59,130,246,0.12)] transition-all duration-200"
      >
        <!-- 구글 컬러 'G' 공식 SVG 로고 -->
        <div class="flex-shrink-0 mr-3 flex items-center justify-center" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </div>

        <!-- 구글 검색어 입력 필드 -->
        <input
          id="googleSearchInput"
          name="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Google 검색 (단축키 /)"
          aria-label="Google 검색어 입력"
          class="w-full bg-transparent text-sm sm:text-[15px] text-neutral-800 dark:text-neutral-100 placeholder-neutral-400 dark:placeholder-neutral-500 focus:outline-none"
        />

        <!-- 단축키 '/' 힌트 뱃지 -->
        <span
          id="googleShortcutHint"
          class="hidden sm:inline-flex items-center justify-center px-1.5 py-0.5 mr-1.5 text-[11px] font-medium text-neutral-400 dark:text-neutral-500 bg-neutral-100 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded select-none pointer-events-none transition-opacity duration-150"
        >
          /
        </span>

        <!-- 구글 입력 텍스트 초기화 'X' 클리어 버튼 -->
        <button
          id="googleClearBtn"
          type="button"
          aria-label="Google 검색어 지우기"
          title="지우기"
          class="hidden flex-shrink-0 p-1 mr-1 rounded-full text-neutral-400 hover:text-neutral-600 dark:text-neutral-500 dark:hover:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors duration-150 focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <!-- 구분선 -->
        <div class="h-4 w-[1px] bg-neutral-200 dark:bg-neutral-700 mx-1.5 flex-shrink-0"></div>

        <!-- 구글 검색 실행 버튼 -->
        <button
          id="googleSubmitBtn"
          type="submit"
          aria-label="새 창에서 Google 검색"
          title="새 창에서 Google 검색"
          class="flex-shrink-0 p-1.5 rounded-full text-neutral-500 hover:text-blue-600 dark:text-neutral-400 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950/40 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500/40"
        >
          <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path stroke-linecap="round" d="M20 20l-3.5-3.5"></path>
          </svg>
        </button>
      </div>
    </form>

    <!-- 2. 네이버(Naver) 빠른 검색창 -->
    <form
      id="naverSearchForm"
      action="https://search.naver.com/search.naver"
      method="get"
      target="_blank"
      rel="noopener noreferrer"
      novalidate
      class="relative group"
    >
      <div
        id="naverSearchBarWrapper"
        class="flex items-center w-full h-11 sm:h-12 px-3.5 sm:px-4 rounded-full bg-white dark:bg-notion-darkSurface border border-notion-lightBorder dark:border-notion-darkBorder shadow-[0_1px_4px_rgba(0,0,0,0.04)] dark:shadow-[0_1px_6px_rgba(0,0,0,0.25)] hover:shadow-[0_2px_8px_rgba(0,0,0,0.08)] dark:hover:border-neutral-600 focus-within:border-[#03C75A]/70 dark:focus-within:border-[#03C75A]/60 focus-within:shadow-[0_2px_10px_rgba(3,199,90,0.14)] transition-all duration-200"
      >
        <!-- 네이버 브랜드 'N' 로고 SVG -->
        <div class="flex-shrink-0 mr-3 flex items-center justify-center" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="5" fill="#03C75A"/>
            <path d="M13.86 12.48L9.97 6.8H6.8v10.4h3.34v-5.68l3.89 5.68h3.17V6.8h-3.34v5.68z" fill="#FFFFFF"/>
          </svg>
        </div>

        <!-- 네이버 검색어 입력 필드 -->
        <input
          id="naverSearchInput"
          name="query"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Naver 검색"
          aria-label="Naver 검색어 입력"
          class="w-full bg-transparent text-sm sm:text-[15px] text-neutral-800 dark:text-neutral-100 placeholder-neutral-400 dark:placeholder-neutral-500 focus:outline-none"
        />

        <!-- 네이버 입력 텍스트 초기화 'X' 클리어 버튼 -->
        <button
          id="naverClearBtn"
          type="button"
          aria-label="Naver 검색어 지우기"
          title="지우기"
          class="hidden flex-shrink-0 p-1 mr-1 rounded-full text-neutral-400 hover:text-neutral-600 dark:text-neutral-500 dark:hover:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors duration-150 focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <!-- 구분선 -->
        <div class="h-4 w-[1px] bg-neutral-200 dark:bg-neutral-700 mx-1.5 flex-shrink-0"></div>

        <!-- 네이버 검색 실행 버튼 -->
        <button
          id="naverSubmitBtn"
          type="submit"
          aria-label="새 창에서 Naver 검색"
          title="새 창에서 Naver 검색"
          class="flex-shrink-0 p-1.5 rounded-full text-neutral-500 hover:text-[#03C75A] dark:text-neutral-400 dark:hover:text-[#03C75A] hover:bg-[#03C75A]/10 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-[#03C75A]/40"
        >
          <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path stroke-linecap="round" d="M20 20l-3.5-3.5"></path>
          </svg>
        </button>
      </div>
    </form>

    <!-- 3. 유튜브(YouTube) 빠른 검색창 -->
    <form
      id="youtubeSearchForm"
      action="https://www.youtube.com/results"
      method="get"
      target="_blank"
      rel="noopener noreferrer"
      novalidate
      class="relative group"
    >
      <div
        id="youtubeSearchBarWrapper"
        class="flex items-center w-full h-11 sm:h-12 px-3.5 sm:px-4 rounded-full bg-white dark:bg-notion-darkSurface border border-notion-lightBorder dark:border-notion-darkBorder shadow-[0_1px_4px_rgba(0,0,0,0.04)] dark:shadow-[0_1px_6px_rgba(0,0,0,0.25)] hover:shadow-[0_2px_8px_rgba(0,0,0,0.08)] dark:hover:border-neutral-600 focus-within:border-[#FF0000]/60 dark:focus-within:border-[#FF0000]/60 focus-within:shadow-[0_2px_10px_rgba(255,0,0,0.12)] transition-all duration-200"
      >
        <!-- 유튜브 브랜드 공식 플레이 로고 SVG -->
        <div class="flex-shrink-0 mr-3 flex items-center justify-center" aria-hidden="true">
          <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z" fill="#FF0000"/>
            <path d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FFFFFF"/>
          </svg>
        </div>

        <!-- 유튜브 검색어 입력 필드 -->
        <input
          id="youtubeSearchInput"
          name="search_query"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="YouTube 검색"
          aria-label="YouTube 검색어 입력"
          class="w-full bg-transparent text-sm sm:text-[15px] text-neutral-800 dark:text-neutral-100 placeholder-neutral-400 dark:placeholder-neutral-500 focus:outline-none"
        />

        <!-- 유튜브 입력 텍스트 초기화 'X' 클리어 버튼 -->
        <button
          id="youtubeClearBtn"
          type="button"
          aria-label="YouTube 검색어 지우기"
          title="지우기"
          class="hidden flex-shrink-0 p-1 mr-1 rounded-full text-neutral-400 hover:text-neutral-600 dark:text-neutral-500 dark:hover:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors duration-150 focus:outline-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

        <!-- 구분선 -->
        <div class="h-4 w-[1px] bg-neutral-200 dark:bg-neutral-700 mx-1.5 flex-shrink-0"></div>

        <!-- 유튜브 검색 실행 버튼 -->
        <button
          id="youtubeSubmitBtn"
          type="submit"
          aria-label="새 창에서 YouTube 검색"
          title="새 창에서 YouTube 검색"
          class="flex-shrink-0 p-1.5 rounded-full text-neutral-500 hover:text-[#FF0000] dark:text-neutral-400 dark:hover:text-[#FF0000] hover:bg-[#FF0000]/10 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-[#FF0000]/40"
        >
          <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path stroke-linecap="round" d="M20 20l-3.5-3.5"></path>
          </svg>
        </button>
      </div>
    </form>
  </main>

  <script>
    (function () {
      // DOM 요소 참조
      const htmlEl = document.documentElement;
      const themeToggleBtn = document.getElementById('themeToggleBtn');

      // 1. 테마 관리 (기본값: 노션 라이트 모드 #FFFFFF, localStorage 저장 지원)
      const THEME_STORAGE_KEY = 'notion-google-widget-theme';

      function applyTheme(theme) {
        if (theme === 'dark') {
          htmlEl.classList.add('dark');
        } else {
          htmlEl.classList.remove('dark');
        }
      }

      // 저장된 테마가 있으면 적용, 없으면 기본 라이트 모드 유지
      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        if (savedTheme === 'dark') {
          applyTheme('dark');
        } else {
          applyTheme('light');
        }
      } catch (e) {
        // iframe 샌드박스에서 localStorage 접근 제한 시 기본값(라이트) 유지
        applyTheme('light');
      }

      // 테마 토글 버튼 클릭 이벤트
      themeToggleBtn.addEventListener('click', function () {
        const isDark = htmlEl.classList.contains('dark');
        const nextTheme = isDark ? 'light' : 'dark';
        applyTheme(nextTheme);
        try {
          localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
        } catch (e) {
          // 스토리지 제한 환경 무시
        }
      });

      // 2. 검색바 초기화 및 공통 동작 설정 헬퍼 함수
      function setupSearchWidget(config) {
        const form = document.getElementById(config.formId);
        const wrapper = document.getElementById(config.wrapperId);
        const input = document.getElementById(config.inputId);
        const clearBtn = document.getElementById(config.clearBtnId);
        const shortcutHint = config.shortcutHintId
          ? document.getElementById(config.shortcutHintId)
          : null;

        // 입력창 상태(클리어 버튼 & 단축키 힌트) 동기화
        function updateInputUI() {
          const hasValue = input.value.length > 0;
          const isFocused = document.activeElement === input;

          if (hasValue) {
            clearBtn.classList.remove('hidden');
            if (shortcutHint) shortcutHint.classList.add('opacity-0');
          } else {
            clearBtn.classList.add('hidden');
            if (shortcutHint) {
              if (isFocused) {
                shortcutHint.classList.add('opacity-0');
              } else {
                shortcutHint.classList.remove('opacity-0');
              }
            }
          }
        }

        input.addEventListener('input', updateInputUI);
        input.addEventListener('focus', updateInputUI);
        input.addEventListener('blur', updateInputUI);

        // 클리어('X') 버튼 클릭 시 입력값 초기화 및 포커스
        clearBtn.addEventListener('click', function () {
          input.value = '';
          input.focus();
          updateInputUI();
        });

        // 빈 입력창 흔들림(Shake) 피드백 함수
        function triggerShakeFeedback() {
          wrapper.classList.remove('animate-shake');
          void wrapper.offsetWidth;
          wrapper.classList.add('animate-shake');
          input.focus();
        }

        // 검색 폼 제출 처리 (노션 iframe 환경에서도 새 창 1개만 열리도록 기본 form 제출 차단 후 단일 링크 클릭)
        form.addEventListener('submit', function (event) {
          // 노션 iframe 샌드박스에서 form target="_blank"가 중복 팝업을 유발하므로 기본 제출을 항상 차단
          event.preventDefault();
          event.stopPropagation();

          const query = input.value.trim();

          // 검색어가 비어있으면 흔들림 피드백 표시
          if (!query) {
            triggerShakeFeedback();
            return;
          }

          const targetUrl = config.searchBaseUrl + encodeURIComponent(query);

          // 임시 <a> 태그를 생성해 단일 클릭 이벤트를 발생시켜 노션 iframe에서도 창이 1개만 열리도록 처리
          const link = document.createElement('a');
          link.href = targetUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        });

        // 초기 UI 상태 설정
        updateInputUI();

        return input;
      }

      // 구글 검색창 설정
      const googleInput = setupSearchWidget({
        formId: 'googleSearchForm',
        wrapperId: 'googleSearchBarWrapper',
        inputId: 'googleSearchInput',
        clearBtnId: 'googleClearBtn',
        shortcutHintId: 'googleShortcutHint',
        searchBaseUrl: 'https://www.google.com/search?q='
      });

      // 네이버 검색창 설정
      setupSearchWidget({
        formId: 'naverSearchForm',
        wrapperId: 'naverSearchBarWrapper',
        inputId: 'naverSearchInput',
        clearBtnId: 'naverClearBtn',
        shortcutHintId: null,
        searchBaseUrl: 'https://search.naver.com/search.naver?query='
      });

      // 유튜브 검색창 설정
      setupSearchWidget({
        formId: 'youtubeSearchForm',
        wrapperId: 'youtubeSearchBarWrapper',
        inputId: 'youtubeSearchInput',
        clearBtnId: 'youtubeClearBtn',
        shortcutHintId: null,
        searchBaseUrl: 'https://www.youtube.com/results?search_query='
      });

      // 3. 단축키 '/' 입력 시 첫 번째(구글) 검색창 자동 포커스
      document.addEventListener('keydown', function (event) {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (
          event.key === '/' &&
          activeTag !== 'INPUT' &&
          activeTag !== 'TEXTAREA' &&
          !event.ctrlKey &&
          !event.metaKey &&
          !event.altKey
        ) {
          event.preventDefault();
          googleInput.focus();
        }
      });
    })();
  </script>
</body>
</html>
